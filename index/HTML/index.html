<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Finder</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/styles.css">
</head>

<body>

    <!-- HEADER -->
   <header class="header">

    <div class="container header-content">

        <h1>🍴 MEAL FINDER</h1>

       <button
    id="menuButton"
    class="menu-button"
    type="button"
    onclick="openSideMenu()"
>
    ☰
</button>

    </div>

</header>

<!-- SIDE MENU -->

<div id="sideMenu" class="side-menu">

  <button
    id="closeMenu"
    class="close-button"
    type="button"
    onclick="closeSideMenu()"
>
    ×
</button>

    <div id="menuCategories">
        <!-- Categories will come from API -->
    </div>

</div>


    <!-- HERO SECTION -->
    <section class="hero">

        <div class="hero-content">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search recipes here..."
                >

                <button id="searchBtn">
                    🔍
                </button>

            </div>

            <h2>What are your favorite cuisines?</h2>

            <p>PERSONALIZE YOUR EXPERIENCE</p>

        </div>

    </section>


    <!-- CATEGORIES -->
<main>

    <!-- CATEGORY INFORMATION -->
    <section
        class="category-info-section"
        id="categoryInfoSection"
    >
        <div class="container">

            <div id="categoryInfo">
                <!-- Category description comes from API -->
            </div>

        </div>
    </section>


    <!-- MEALS -->
    <section
        class="meals-section"
        id="mealsSection"
    >
        <div class="container">

            <h2
                class="section-title"
                id="mealsTitle"
            >
                MEALS
            </h2>

            <div
                id="meals"
                class="meals-grid"
            >
                <!-- Meals come from API -->
            </div>

        </div>
    </section>


    <!-- MEAL DETAILS -->
    <section
        class="meal-details-section"
        id="mealDetailsSection"
    >
        <div class="container">

            <div id="mealDetails">
                <!-- Meal details come from API -->
            </div>

        </div>
    </section>


    <!-- CATEGORIES -->
    <section
        class="categories-section"
        id="categoriesSection"
    >
        <div class="container">

            <h2 class="section-title">
                CATEGORIES
            </h2>

            <div
                id="categories"
                class="categories-grid"
            >
                <!-- Categories come from API -->
            </div>

        </div>
    </section>

</main>

    <!-- JAVASCRIPT -->
    <script src="../JS/script.js"></script>

</body>

</html>
