<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Finder</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/styles.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <h1>🍴 MEAL FINDER</h1>
        </div>
    </header>


    <!-- HERO SECTION -->
    <section class="hero">

        <div class="hero-content">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search recipes here..."
                >

                <button id="searchBtn">
                    🔍
                </button>

            </div>

            <h2>What are your favorite cuisines?</h2>

            <p>PERSONALIZE YOUR EXPERIENCE</p>

        </div>

    </section>


    <!-- CATEGORIES -->
    <main>

        <section class="categories-section">

            <div class="container">

                <h2 class="section-title">
                    CATEGORIES
                </h2>

                <div id="categories" class="categories-grid">

                    <!-- JavaScript will put categories here -->

                </div>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="../JS/script.js"></script>

</body>

</html>
